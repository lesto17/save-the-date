<style>
  :root {
    --bg: #E2CBF6;
    --accent: #1f48ff;
    --pale: #fff8db;
    --white: #ffffff;
    --script: 'Moontime', cursive;
    --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); overflow-x: hidden; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    font-family: var(--sans);
  }
  .page {
    width: 100%;
    max-width: 480px;
    padding: 28px 28px 40px;
    padding-top: max(28px, env(safe-area-inset-top));
    padding-bottom: max(40px, env(safe-area-inset-bottom));
    padding-left: max(28px, env(safe-area-inset-left));
    padding-right: max(28px, env(safe-area-inset-right));
  }

  .quote {
    font-family: var(--script);
    color: var(--pale);
    font-size: 30px;
    text-align: center;
    margin: 0 0 28px;
    line-height: 1;
  }

  .photo-block {
    position: relative;
    width: 100%;
    padding-bottom: 46px;
  }
  .photo-circle {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--pale);
  }
  .photo-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
    display: block;
  }

  .save-date {
    position: absolute;
    right: 2%;
    bottom: 9%;
    text-align: right;
    line-height: 0.75;
    transform: rotate(-7deg);
    pointer-events: none;
  }
  .save-date .save {
    font-family: var(--script);
    color: var(--accent);
    font-size: 78px;
    display: block;
  }
  .save-date .the {
    font-family: var(--script);
    color: var(--accent);
    font-size: 34px;
    display: block;
    text-align: right;
    margin: -14px 4px 0 0;
  }
  .save-date .date {
    font-family: var(--script);
    color: var(--accent);
    font-size: 78px;
    display: block;
    margin-top: -10px;
    margin-right: -22px;
  }

  .names {
    font-family: var(--sans);
    font-weight: 300;
    font-size: 27px;
    letter-spacing: 0.19em;
    color: var(--accent);
    text-align: center;
    margin: 20px 0 14px;
    padding-left: 0.19em; /* gleicht den Letter-Spacing-Versatz am Zeilenende aus */
    white-space: nowrap;
  }

  .meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 16px;
    color: var(--white);
    margin-bottom: 26px;
  }
  .meta .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }

  .more-info {
    font-family: var(--sans);
    font-style: italic;
    font-size: 13.5px;
    color: rgba(255, 255, 255, 0.8);
    text-align: center;
    margin: 22px 0 0;
  }

  #calWrap { max-width: 235px; margin: 14px auto 0; position: relative; }
  #calBtn {
    display: block;
    width: 100%;
    padding: 10px 16px;
    font: 600 12.5px var(--sans);
    letter-spacing: 0.01em;
    white-space: nowrap;
    cursor: pointer;
    background: var(--bg);
    color: #fff;
    border: 1.5px solid var(--pale);
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    text-align: center;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  #calBtn:hover { box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12); }
  #calBtn:active { transform: scale(0.98); }
  #calMenu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--bg);
    border: 1.5px solid var(--pale);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
    z-index: 10;
  }
  #calMenu a {
    display: block;
    padding: 10px 16px;
    font: 500 13px var(--sans);
    color: #fff;
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 248, 219, 0.35);
  }
  #calMenu a:last-child { border-bottom: none; }
  #calMenu a:hover { background: rgba(255, 248, 219, 0.15); }
  #iosHint {
    display: none;
    margin-top: 4px;
    font: 400 10.5px var(--sans);
    line-height: 1.35;
    color: rgba(255, 255, 255, 0.75);
  }
</style>
</head>
<body>
<div class="page">

  <p class="quote">» so, it's gonna be forever «</p>

  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Sophia & Stefan//Save the Date//DE",
    "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:hochzeit-sophia-stefan-2027@sophiaundstefan-endlichunterderhaube.de",
    "DTSTAMP:" + toICSStamp(new Date()),
    "DTSTART:" + startUTC,
    "DTEND:" + endUTC,
    "SUMMARY:" + title,
    "LOCATION:" + venue,
    "DESCRIPTION:" + details,
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");
  const icsBlob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const icsLinkEl = document.getElementById('icsLink');
  icsLinkEl.href = URL.createObjectURL(icsBlob);
  document.getElementById('googleLink').href = googleUrl;

  // "?ios=1" an die URL anhängen erzwingt die iPhone-Ansicht zu Testzwecken,
  // z. B. https://.../?ios=1 – für echte Besucher ohne diesen Parameter
  // entscheidet weiterhin die normale Geräte-Erkennung.
  const forceIOS = new URLSearchParams(location.search).get('ios') === '1';
  const isIOS = forceIOS || /iP(hone|od|ad)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (isIOS) {
    // kein "download": iOS öffnet damit den nativen "Termin hinzufügen"-Dialog
    // statt nur einen Datei-Download zu versuchen.
    icsLinkEl.removeAttribute('download');
    document.getElementById('iosHint').style.display = 'block';
  }

  document.getElementById('calBtn').addEventListener('click', () => {
    const menu = document.getElementById('calMenu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  });

  document.addEventListener('click', (e) => {
    if (!document.getElementById('calWrap').contains(e.target)) {
      document.getElementById('calMenu').style.display = 'none';
    }
  });
})();
</script>
</body>
</html>
