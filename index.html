<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Save the Date – Sophia & Stefan</title>
<meta name="description" content="Sophia & Stefan – Save the Date, 10.07.2027, Schornhof Wolfach">

<meta property="og:title" content="Save the Date – Sophia & Stefan">
<meta property="og:description" content="10.07.2027 · Schornhof Wolfach">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lesto17.github.io/save-the-date/">
<meta property="og:image" content="https://lesto17.github.io/save-the-date/og-image.jpg">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%92%8D</text></svg>">

<style>
  :root { --bg: #E2CBF6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); min-height: 100%; overflow-x: hidden; }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px 16px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card { width: 100%; max-width: 520px; }
  .card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
  }
  #calWrap { max-width: 320px; margin: 20px auto 0; position: relative; }
  #calBtn {
    width: 100%;
    padding: 14px 20px;
    font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    cursor: pointer;
    background: #fff;
    color: #E67A2E;
    border: 1.5px solid #E67A2E;
    border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.10);
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  #calBtn:hover, #calBtn:active { background: #FFF6EE; }
  #calMenu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
    z-index: 10;
  }
  #calMenu a {
    display: block;
    padding: 13px 16px;
    font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #4A4A4A;
    text-decoration: none;
    border-bottom: 1px solid #F0F0F0;
  }
  #calMenu a:last-child { border-bottom: none; }
  #calMenu a:hover { background: #FAF5FF; }
  #iosHint {
    display: none;
    max-width: 320px;
    margin: 10px auto 0;
    font-size: 12.5px;
    line-height: 1.4;
    color: #6b6b6b;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <img
      src="save-the-date.png"
      alt="Save the Date – Sophia & Stefan, 10.07.2027, Schornhof Wolfach"
      width="1240"
      height="1750"
    >

    <div id="calWrap">
      <button id="calBtn" type="button">📅 Zum Kalender hinzufügen</button>
      <div id="calMenu">
        <a id="icsLink" href="#" download="hochzeit-stefan-sophia.ics">Apple / Outlook (.ics)</a>
        <a id="googleLink" href="#" target="_blank" rel="noopener">Google Kalender</a>
      </div>
    </div>
    <p id="iosHint">📱 iPhone-Tipp: Im sich öffnenden Kalender-Fenster ganz unten auf <strong>„Hinzufügen"</strong> tippen – der Haken oben rechts speichert den Termin nicht.</p>
  </div>

<script>
(function () {
  const title = "Hochzeit Stefan & Sophia \u{1FAF6}";
  // Lokale Berliner Zeit (für den Google-Kalender-Link, der per &ctz selbst umrechnet)
  const startLocal = "20270710T150000";
  const endLocal   = "20270711T050000";
  // Dieselben Zeitpunkte fest in UTC (10.07.2027 ist Sommerzeit: MESZ = UTC+2) – nötig für die .ics-Datei,
  // damit Gäste in jeder Zeitzone die korrekte Uhrzeit (15:00 Uhr Ortszeit Wolfach) angezeigt bekommen.
  const startUTC = "20270710T130000Z";
  const endUTC   = "20270711T030000Z";
  const location = "Schornhof, Wolfach";
  const details  = "Wir freuen uns auf euch! Mehr Infos zum Ort: https://maps.app.goo.gl/Bv9mD9XbjficxnVM7";

  const googleUrl = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(title)
    + "&dates=" + startLocal + "/" + endLocal
    + "&details=" + encodeURIComponent(details)
    + "&location=" + encodeURIComponent(location)
    + "&ctz=Europe/Berlin";
  document.getElementById('googleLink').href = googleUrl;

  function pad(n) { return String(n).padStart(2, '0'); }
  function toICSStamp(d) {
    return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate())
      + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  }

  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Sophia & Stefan//Save the Date//DE",
    "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:hochzeit-sophia-stefan-2027@sophiaundstefan-endlichunterderhaube.de",
    "DTSTAMP:" + toICSStamp(new Date()),
    "DTSTART:" + startUTC,
    "DTEND:" + endUTC,
    "SUMMARY:" + title,
    "LOCATION:" + location,
    "DESCRIPTION:" + details,
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");
  const icsLinkEl = document.getElementById('icsLink');

  // Wichtig: moderne Browser (v.a. iOS Safari) blockieren die direkte Navigation zu
  // "data:"-Links aus Sicherheitsgründen (Phishing-Schutz) – der Klick passiert dann
  // einfach gar nichts. Der zuverlässige Weg ist ein Blob: eine im Browser selbst
  // erzeugte Datei mit eigener, sicherer URL.
  const icsBlob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  icsLinkEl.href = URL.createObjectURL(icsBlob);

  // iPhone/iPad (Safari) erkennt den Kalender-Dateityp und öffnet ihn direkt im nativen
  // "Termin hinzufügen"-Dialog, wenn man NICHT per "download"-Attribut einen Datei-Download
  // erzwingt. Auf Android/Desktop bleibt der echte Datei-Download über "download" bestehen.
  const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) {
    icsLinkEl.removeAttribute('download');
    document.getElementById('iosHint').style.display = 'block';
  }

  document.getElementById('calBtn').addEventListener('click', () => {
    const menu = document.getElementById('calMenu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  });

  document.addEventListener('click', (e) => {
    if (!document.getElementById('calWrap').contains(e.target)) {
      document.getElementById('calMenu').style.display = 'none';
    }
  });
})();
</script>
</body>
</html>
